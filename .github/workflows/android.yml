name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce launcher permission budget
        run: |
          unexpected=$(grep '<uses-permission' app/src/main/AndroidManifest.xml | grep -v 'android.permission.ACCESS_NETWORK_STATE' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected uses-permission declaration:"
            echo "$unexpected"
            exit 1
          fi
          test -s app/src/main/baseline-prof.txt

      - name: Verify, lint and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Prepare installable APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KoSch-AI-Launcher-M2.4-debug.apk
          sha256sum dist/KoSch-AI-Launcher-M2.4-debug.apk > dist/KoSch-AI-Launcher-M2.4-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kosch-ai-launcher-m2.4-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
