name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up open-source Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enforce launcher permission budget
        run: |
          allowed='android.permission.ACCESS_NETWORK_STATE|android.permission.CAMERA|android.permission.FOREGROUND_SERVICE|android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION'
          unexpected=$(grep '<uses-permission' app/src/main/AndroidManifest.xml | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected uses-permission declaration:"
            echo "$unexpected"
            exit 1
          fi
          test "$(grep -c '<uses-permission' app/src/main/AndroidManifest.xml)" -eq 4
          test -s app/src/main/baseline-prof.txt

      - name: Verify, lint and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --stacktrace

      - name: Verify packaged permission and release compliance budget
        run: |
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          release_apk=app/build/outputs/apk/release/app-release.apk

          debug_permissions=$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$debug_apk")
          release_permissions=$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$release_apk")
          echo "$debug_permissions"
          echo "$release_permissions"

          for packaged_permissions in "$debug_permissions" "$release_permissions"
          do
            if echo "$packaged_permissions" | grep -q 'android.permission.INTERNET'; then
              echo "INTERNET permission must not enter the offline launcher APK"
              exit 1
            fi
            if echo "$packaged_permissions" | grep -q 'android.permission.RECORD_AUDIO'; then
              echo "RECORD_AUDIO must not enter before the explicit local wake-word stage"
              exit 1
            fi
            for permission in \
              android.permission.ACCESS_NETWORK_STATE \
              android.permission.CAMERA \
              android.permission.FOREGROUND_SERVICE \
              android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION
            do
              echo "$packaged_permissions" | grep -q "$permission"
            done
          done

          debug_manifest=$($ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree "$debug_apk" AndroidManifest.xml)
          release_manifest=$($ANDROID_HOME/build-tools/36.0.0/aapt dump xmltree "$release_apk" AndroidManifest.xml)

          echo "$debug_manifest" | grep -q 'KoSchConsentVpnService'
          echo "$debug_manifest" | grep -q 'SecurityNetworkActivity'

          if echo "$release_manifest" | grep -q 'KoSchConsentVpnService'; then
            echo "Release APK must not contain the inert N1 VpnService prototype"
            exit 1
          fi
          if echo "$release_manifest" | grep -q 'SecurityNetworkActivity'; then
            echo "Release APK must not expose the debug-only N1 Security surface"
            exit 1
          fi

      - name: Prepare installable APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KoSch-AI-Launcher-M2.5-debug.apk
          cd dist
          sha256sum KoSch-AI-Launcher-M2.5-debug.apk > KoSch-AI-Launcher-M2.5-debug.apk.sha256
          sha256sum -c KoSch-AI-Launcher-M2.5-debug.apk.sha256

      - name: Prepare instrumentation test package
        run: |
          mkdir -p dist-instrumentation
          cp app/build/outputs/apk/debug/app-debug.apk dist-instrumentation/KoSch-AI-Launcher-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist-instrumentation/KoSch-AI-Launcher-debug-androidTest.apk
          cd dist-instrumentation
          sha256sum KoSch-AI-Launcher-debug.apk KoSch-AI-Launcher-debug-androidTest.apk > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kosch-ai-launcher-m2.5-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation package
        uses: actions/upload-artifact@v4
        with:
          name: kosch-ai-launcher-instrumentation
          path: dist-instrumentation/
          if-no-files-found: error
          retention-days: 14

  instrumented-api36:
    name: Instrumented tests · API 36 AOSP
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install emulator tooling
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up open-source Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run API 36 managed-device tests
        run: ./gradlew --no-daemon pixel2Api36DebugAndroidTest --stacktrace

      - name: Upload managed-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosch-ai-api36-managed-device-results
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 30
