<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">KAL professional shell banner</title><desc id="desc">KAL banner showing the unified navigation and professional workspace slogan.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111528"/><stop offset="1" stop-color="#39275a"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1a5ff"/><stop offset="1" stop-color="#638cff"/></linearGradient></defs><rect width="1600" height="500" rx="35" fill="url(#bg)"/><circle cx="1400" cy="470" r="290" fill="#aa92ff" opacity=".13"/><text x="100" y="102" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#c1a5ff">ONE PROFESSIONAL SHELL</text><text x="100" y="193" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">Ein Launcher.</text><text x="100" y="254" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">Deine Tools. Dein Fokus.</text><text x="100" y="308" font-family="Inter,Arial,sans-serif" font-size="20" fill="#c5c3d7">Home · Apps · Workspace · AI News · Tools · Pen Space</text><rect x="100" y="363" width="287" height="55" rx="19" fill="url(#violet)"/><text x="244" y="398" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#111528">ONE CALM SURFACE</text><rect x="920" y="76" width="525" height="348" rx="30" fill="#11182b" stroke="#715fa8"/><rect x="956" y="112" width="176" height="274" rx="20" fill="#19203a"/><text x="979" y="151" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#f1f7ff">KAL</text><g font-family="Inter,Arial,sans-serif" font-size="13"><rect x="974" y="175" width="140" height="35" rx="11" fill="#c1a5ff" opacity=".18"/><text x="994" y="198" fill="#f1f7ff">⌂ Home</text><text x="994" y="235" fill="#9da0ba">▦ Apps</text><text x="994" y="272" fill="#9da0ba">□ Workspace</text><text x="994" y="309" fill="#9da0ba">◈ AI News</text><text x="994" y="346" fill="#9da0ba">✦ Tools</text></g><rect x="1160" y="112" width="249" height="274" rx="20" fill="#182039"/><text x="1188" y="150" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c1a5ff">KAL WORKSPACE</text><text x="1188" y="189" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#f1f7ff">Mein Fokus</text><rect x="1188" y="213" width="193" height="45" rx="14" fill="#213052"/><text x="1208" y="241" font-family="Inter,Arial,sans-serif" font-size="12" fill="#f1f7ff">✦ KAL Notes</text><rect x="1188" y="270" width="193" height="45" rx="14" fill="#213052"/><text x="1208" y="298" font-family="Inter,Arial,sans-serif" font-size="12" fill="#f1f7ff">◎ Calendar</text><text x="1188" y="352" font-family="Inter,Arial,sans-serif" font-size="11" fill="#9da0ba">Arrange · save · recover</text></svg>
