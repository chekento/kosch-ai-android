<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">KAL Pen Space</title><desc id="desc">A calm pen workspace with canvas, ink tools, system note and export controls.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#22243c"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcf7"/><stop offset="1" stop-color="#dcebea"/></linearGradient></defs><rect width="1200" height="700" rx="34" fill="url(#bg)"/><rect x="35" y="35" width="210" height="630" rx="24" fill="#0d1d2d" stroke="#29415d"/><rect x="53" y="360" width="174" height="45" rx="13" fill="#4ac8f5" opacity=".16"/><text x="70" y="388" font-family="Arial" font-size="16" fill="#4ac8f5">✎</text><text x="94" y="388" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f7ff">Pen Space</text><g font-family="Inter,Arial,sans-serif" font-size="14"><text x="70" y="154" fill="#98acc2">⌂</text><text x="94" y="154" fill="#98acc2">Home</text><text x="70" y="201" fill="#98acc2">▦</text><text x="94" y="201" fill="#98acc2">Apps</text><text x="70" y="248" fill="#98acc2">□</text><text x="94" y="248" fill="#98acc2">Workspace</text><text x="70" y="295" fill="#98acc2">◈</text><text x="94" y="295" fill="#98acc2">AI News</text><text x="70" y="342" fill="#98acc2">✦</text><text x="94" y="342" fill="#98acc2">Tools</text><text x="70" y="436" fill="#98acc2">⚙</text><text x="94" y="436" fill="#98acc2">Settings</text></g><rect x="53" y="552" width="174" height="80" rx="16" fill="#142d40"/><text x="68" y="575" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" fill="#4ac8f5">INK LOCAL</text><text x="68" y="596" font-family="Inter,Arial,sans-serif" font-size="10" fill="#b8c9d8">Stift erkannt.</text><text x="68" y="613" font-family="Inter,Arial,sans-serif" font-size="10" fill="#b8c9d8">Export auf Wunsch.</text><rect x="272" y="35" width="893" height="630" rx="24" fill="#0b1a2a" stroke="#29415d"/><text x="307" y="84" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#f1f7ff">Pen Space</text><text x="307" y="108" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98acc2">Skizzieren, markieren, als Notiz sichern</text><rect x="307" y="134" width="823" height="55" rx="17" fill="#132b3d"/><circle cx="335" cy="161" r="11" fill="#4ac8f5"/><text x="359" y="166" font-family="Inter,Arial,sans-serif" font-size="12" fill="#f1f7ff">KAL erkennt deinen Stift und öffnet einen ruhigen Zeichenraum.</text><text x="1014" y="166" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4ac8f5">READY</text><rect x="307" y="216" width="634" height="337" rx="18" fill="url(#paper)"/><path d="M365 430 C430 340 463 473 526 368 S632 330 686 403 S782 466 862 315" fill="none" stroke="#213d68" stroke-width="8" stroke-linecap="round"/><path d="M391 310 C447 300 487 322 532 304" fill="none" stroke="#41a4a2" stroke-width="4" stroke-linecap="round"/><text x="355" y="268" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#29445b">Sprint notes</text><text x="355" y="510" font-family="Inter,Arial,sans-serif" font-size="12" fill="#55717a">Ideas stay on the page until you choose to export.</text><rect x="964" y="216" width="166" height="337" rx="18" fill="#101f34"/><text x="987" y="250" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">TOOLS</text><g font-family="Inter,Arial,sans-serif" font-size="12"><rect x="987" y="270" width="120" height="39" rx="12" fill="#4ac8f5" opacity=".17"/><text x="1005" y="295" fill="#4ac8f5">✎ Pen</text><rect x="987" y="320" width="120" height="39" rx="12" fill="#172b42"/><text x="1005" y="345" fill="#98acc2">⌁ Highlighter</text><rect x="987" y="370" width="120" height="39" rx="12" fill="#172b42"/><text x="1005" y="395" fill="#98acc2">⌫ Eraser</text><rect x="987" y="420" width="120" height="39" rx="12" fill="#172b42"/><text x="1005" y="445" fill="#98acc2">▧ Systemnotiz</text><rect x="987" y="470" width="120" height="39" rx="12" fill="#7bf2ca" opacity=".15"/><text x="1005" y="495" fill="#7bf2ca">↗ Export</text></g><text x="307" y="598" font-family="Inter,Arial,sans-serif" font-size="11" fill="#4ac8f5">CONSENT-FIRST</text><text x="407" y="598" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">Keine Übertragung ohne deine Aktion.</text></svg>
