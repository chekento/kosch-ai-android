<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">KAL local-first banner</title><desc id="desc">KAL marketing banner with the local-first slogan and a clean command center illustration.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#16445a"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4ffe0"/><stop offset="1" stop-color="#4ac8f5"/></linearGradient></defs><rect width="1600" height="500" rx="35" fill="url(#bg)"/><circle cx="1430" cy="-50" r="300" fill="#7bf2ca" opacity=".10"/><circle cx="1310" cy="530" r="260" fill="#4ac8f5" opacity=".10"/><text x="100" y="102" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#7bf2ca">KAL · KOSCH AI LAUNCHER</text><text x="100" y="193" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">KI, die zuerst auf</text><text x="100" y="254" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">deinem Gerät denkt.</text><text x="100" y="308" font-family="Inter,Arial,sans-serif" font-size="20" fill="#b8c9d8">Command Center · Workspace · Pen Space · sichtbare Übergaben</text><rect x="100" y="363" width="282" height="55" rx="19" fill="url(#mint)"/><text x="241" y="398" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#07131f">LOCAL-FIRST BY DESIGN</text><rect x="960" y="82" width="480" height="320" rx="28" fill="#0b1a2a" stroke="#31506c"/><rect x="1000" y="122" width="400" height="68" rx="18" fill="#122b3b" stroke="#7bf2ca" stroke-opacity=".4"/><text x="1027" y="152" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7bf2ca">✦ COMMAND CENTER</text><text x="1027" y="176" font-family="Inter,Arial,sans-serif" font-size="13" fill="#98acc2">Was soll KAL für dich erledigen?</text><rect x="1000" y="215" width="190" height="145" rx="19" fill="#11283d"/><text x="1025" y="246" font-family="Inter,Arial,sans-serif" font-size="12" fill="#4ac8f5">ASSISTANT</text><text x="1025" y="279" font-family="Inter,Arial,sans-serif" font-size="22" fill="#f1f7ff">Opt-in</text><text x="1025" y="305" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">Sprache und Kamera</text><text x="1025" y="323" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">bleiben aus.</text><rect x="1210" y="215" width="190" height="145" rx="19" fill="#102d2b"/><text x="1235" y="246" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7bf2ca">PRIVACY</text><text x="1235" y="279" font-family="Inter,Arial,sans-serif" font-size="22" fill="#f1f7ff">Visible</text><text x="1235" y="305" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">Externe Aktionen</text><text x="1235" y="323" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">erst nach Wahl.</text></svg>
