s</text><text x="307" y="108" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98acc2">23 Quellen · Forschung, Produkte, Governance und Sicherheit</text><rect x="307" y="132" width="823" height="58" rx="17" fill="#132b3d" stroke="#ffcf7b" stroke-opacity=".28"/><text x="330" y="158" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#ffcf7b">CONSCIOUS EXTERNAL OPEN</text><text x="330" y="178" font-family="Inter,Arial,sans-serif" font-size="11" fill="#b8c9d8">KAL lädt keine News heimlich im Hintergrund — du entscheidest, wann der Browser startet.</text><g font-family="Inter,Arial,sans-serif"><g fill="#11283d"><rect x="307" y="216" width="250" height="113" rx="18"/><rect x="572" y="216" width="250" height="113" rx="18"/><rect x="837" y="216" width="293" height="113" rx="18"/><rect x="307" y="347" width="250" height="113" rx="18"/><rect x="572" y="347" width="250" height="113" rx="18"/><rect x="837" y="347" width="293" height="113" rx="18"/><rect x="307" y="478" width="250" height="113" rx="18"/><rect x="572" y="478" width="250" height="113" rx="18"/><rect x="837" y="478" width="293" height="113" rx="18"/></g><g font-size="11" fill="#98acc2"><text x="329" y="243" fill="#7bf2ca" font-weight="800">MODELLE</text><text x="329" y="270" font-size="15" fill="#f1f7ff">OpenAI News</text><text x="329" y="291">Anthropic · Mistral · xAI</text><text x="594" y="243" fill="#4ac8f5" font-weight="800">RESEARCH</text><text x="594" y="270" font-size="15" fill="#f1f7ff">Google DeepMind</text><text x="594" y="291">Apple ML · Allen AI · arXiv</text><text x="859" y="243" fill="#aa92ff" font-weight="800">OPEN SOURCE</text><text x="859" y="270" font-size="15" fill="#f1f7ff">Hugging Face</text><text x="859" y="291">Mozilla AI · NVIDIA · Stability</text><text x="329" y="374" fill="#ffcf7b" font-weight="800">GOVERNANCE</text><text x="329" y="401" font-size="15" fill="#f1f7ff">EU AI Act</text><text x="329" y="422">NIST RMF · OECD.AI</text><text x="594" y="374" fill="#ff8ca8" font-weight="800">SECURITY</text><text x="594" y="401" font-size="15" fill="#f1f7ff">OWASP LLM Top 10</text><text x="594" y="422">UK AI Security Institute</text><text x="859" y="374" fill="#4ac8f5" font-weight="800">PRODUCTS</text><text x="859" y="401" font-size="15" fill="#f1f7ff">Microsoft AI</text><text x="859" y="422">Meta · AWS · IBM · Cohere</text><text x="329" y="505" fill="#7bf2ca" font-weight="800">RESEARCH</text><text x="329" y="532" font-size="15" fill="#f1f7ff">Paper trails</text><text x="329" y="553">Primary sources first</text><text x="594" y="505" fill="#aa92ff" font-weight="800">FILTERS</text><text x="594" y="532" font-size="15" fill="#f1f7ff">Category chips</text><text x="594" y="553">No feed algorithm required</text><text x="859" y="505" fill="#ffcf7b" font-weight="800">OPEN</text><text x="859" y="532" font-size="15" fill="#f1f7ff">Browser link →</text><text x="859" y="553">Transparent hand-off</text></g></g>
