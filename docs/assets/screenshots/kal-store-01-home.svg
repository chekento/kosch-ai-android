<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">KAL COMMAND CENTER store screenshot</title>
  <desc id="desc">Local-first start · visible hand-offs · assistant opt-in. Large GitHub and store-style product screenshot based on the current KAL 0.3 alpha UI.</desc>
  <defs>
    <linearGradient id="storeBg01" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06101a"/><stop offset=".56" stop-color="#0b1c2e"/><stop offset="1" stop-color="#17213a"/>
    </linearGradient>
    <radialGradient id="storeGlow01" cx="84%" cy="8%" r="68%">
      <stop stop-color="#7bf2ca" stop-opacity=".22"/><stop offset="1" stop-color="#7bf2ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow01"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1080" height="1350" rx="58" fill="url(#storeBg01)"/>
  <rect width="1080" height="1350" rx="58" fill="url(#storeGlow01)"/>
  <text x="64" y="94" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#7bf2ca">KAL · KoSch AI Launcher</text>
  <text x="64" y="170" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="-2" fill="#f3f8ff">01 · COMMAND CENTER</text>
  <text x="64" y="220" font-family="Inter,Arial,sans-serif" font-size="24" fill="#a8bbcc">Local-first start · visible hand-offs · assistant opt-in</text>
  <g transform="translate(40 286) scale(.833333)" filter="url(#shadow01)">
    
  <title id="title">KAL Home · Command Center</title>
  <desc id="desc">A polished dark KAL launcher home screen with command center, assistant, personal space and local-first privacy card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#13243b"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7bf2ca"/><stop offset="1" stop-color="#4ac8f5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aa92ff"/><stop offset="1" stop-color="#638cff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".30"/></filter>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1035" cy="-30" r="230" fill="#4ac8f5" opacity=".10"/><circle cx="80" cy="730" r="260" fill="#7bf2ca" opacity=".07"/>
  <rect x="32" y="32" width="190" height="636" rx="25" fill="#0d1d2d" stroke="#29415d"/>
  <rect x="52" y="52" width="48" height="48" rx="15" fill="#7bf2ca" opacity=".15"/><text x="76" y="85" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="900" fill="#7bf2ca">K</text>
  <text x="115" y="76" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="900" fill="#f1f7ff">KAL</text><text x="115" y="94" font-family="Inter,Arial,sans-serif" font-size="10" fill="#98acc2">AI LAUNCHER</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14"><rect x="48" y="130" width="158" height="45" rx="13" fill="#7bf2ca" opacity=".16"/><text x="82" y="158" fill="#7bf2ca">⌂</text><text x="105" y="158" fill="#f1f7ff" font-weight="700">Home</text><text x="82" y="205" fill="#98acc2">▦</text><text x="105" y="205" fill="#98acc2">Apps</text><text x="82" y="252" fill="#98acc2">□</text><text x="105" y="252" fill="#98acc2">Workspace</text><text x="82" y="299" fill="#98acc2">◈</text><text x="105" y="299" fill="#98acc2">AI News</text><text x="82" y="346" fill="#98acc2">✦</text><text x="105" y="346" fill="#98acc2">Tools</text><text x="82" y="393" fill="#98acc2">✎</text><text x="105" y="393" fill="#98acc2">Pen Space</text><text x="82" y="440" fill="#98acc2">⚙</text><text x="105" y="440" fill="#98acc2">Settings</text></g>
  <rect x="48" y="556" width="158" height="82" rx="16" fill="#142d40"/><text x="62" y="579" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" fill="#7bf2ca">LOCAL CORE</text><text x="62" y="599" font-family="Inter,Arial,sans-serif" font-size="10" fill="#b8c9d8">Offline bereit.</text><text x="62" y="615" font-family="Inter,Arial,sans-serif" font-size="10" fill="#b8c9d8">Übergaben sichtbar.</text>
  <g filter="url(#shadow)"><rect x="250" y="32" width="918" height="636" rx="25" fill="#0b1a2a" stroke="#29415d"/></g>
  <text x="284" y="76" font-family="Inter,Arial,sans-serif" font-size="15" fill="#98acc2">Guten Tag</text><text x="284" y="110" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800" fill="#f1f7ff">Was soll KAL für dich erledigen?</text>
  <rect x="284" y="140" width="850" height="142" rx="23" fill="#12263a" stroke="#7bf2ca" stroke-opacity=".42"/><circle cx="316" cy="174" r="16" fill="#7bf2ca" opacity=".18"/><text x="316" y="181" text-anchor="middle" font-family="Arial" font-size="17" fill="#7bf2ca">✦</text><text x="346" y="180" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#f1f7ff">Command Center</text><text x="1052" y="180" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7bf2ca">LOKAL ZUERST</text>
  <rect x="307" y="199" width="805" height="48" rx="14" fill="#091722"/><text x="330" y="229" font-family="Inter,Arial,sans-serif" font-size="13" fill="#718aa3">Öffne Kamera, starte eine App, analysiere eine Datei …</text><text x="1060" y="229" font-family="Arial" font-size="17" fill="#4ac8f5">➤</text><text x="307" y="267" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">KAL zeigt Vorschauen und übergibt externe Aktionen erst nach deiner Entscheidung.</text>
  <rect x="284" y="306" width="850" height="116" rx="21" fill="#101f34" stroke="#638cff" stroke-opacity=".35"/><rect x="307" y="329" width="47" height="47" rx="16" fill="#638cff" opacity=".16"/><text x="330" y="360" text-anchor="middle" font-family="Arial" font-size="23" fill="#8fa7ff">✦</text><text x="375" y="346" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#f1f7ff">KAL Assistant</text><text x="375" y="368" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98acc2">Opt-in · Sprache, Screen und Kamera bleiben aus</text><text x="375" y="391" font-family="Inter,Arial,sans-serif" font-size="11" fill="#638cff">Tippen zum Aktivieren und Konfigurieren</text><text x="1090" y="361" font-family="Arial" font-size="22" fill="#638cff">•••</text>
  <text x="284" y="460" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#f1f7ff">Dein Raum</text><text x="284" y="481" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98acc2">Apps, Ordner und Widgets auf einen Blick</text><text x="1057" y="470" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7bf2ca">Workspace →</text>
  <rect x="284" y="500" width="415" height="126" rx="21" fill="#101f34"/><text x="307" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#98acc2">SMART DOCK</text><g fill="#17334a"><rect x="307" y="547" width="70" height="44" rx="13"/><rect x="388" y="547" width="70" height="44" rx="13"/><rect x="469" y="547" width="70" height="44" rx="13"/><rect x="550" y="547" width="70" height="44" rx="13"/></g><g font-family="Arial" font-size="18" text-anchor="middle"><text x="342" y="576" fill="#7bf2ca">✦</text><text x="423" y="576" fill="#4ac8f5">◉</text><text x="504" y="576" fill="#aa92ff">◆</text><text x="585" y="576" fill="#ffcf7b">◌</text></g>
  <rect x="720" y="500" width="414" height="126" rx="21" fill="#102b2c"/><text x="743" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7bf2ca">LOCAL-FIRST BY DESIGN</text><text x="743" y="555" font-family="Inter,Arial,sans-serif" font-size="13" fill="#f1f7ff">Kein API-Key, kein Konto.</text><text x="743" y="578" font-family="Inter,Arial,sans-serif" font-size="11" fill="#98acc2">Keine versteckte Online-Pflicht im Offline-Kern.</text><text x="743" y="603" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7bf2ca">● Externe Übergaben bleiben bewusst.</text>

  </g>
  <rect x="64" y="945" width="952" height="220" rx="34" fill="#0c1c2d" stroke="#29445d"/>
  <text x="96" y="1000" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="2" fill="#7bf2ca">CURRENT 0.3 ALPHA DIRECTION</text>
  <text x="96" y="1054" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800" fill="#f3f8ff">Built as one calm Android shell.</text>
  <text x="96" y="1100" font-family="Inter,Arial,sans-serif" font-size="22" fill="#a8bbcc">Tap the image on the GitHub page to inspect the UI at full size.</text>
  <rect x="64" y="1204" width="952" height="82" rx="28" fill="#7bf2ca" fill-opacity=".11" stroke="#7bf2ca" stroke-opacity=".35"/>
  <text x="96" y="1257" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#7bf2ca">EARLY DEVELOPMENT · TEST ONLY · NOT BETA</text>
