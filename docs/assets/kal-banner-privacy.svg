<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">KAL consent-first privacy banner</title><desc id="desc">KAL banner with the opt-in instead of surveillance slogan and visible permission boundaries.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#173b37"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4ffe0"/><stop offset="1" stop-color="#7bf2ca"/></linearGradient></defs><rect width="1600" height="500" rx="35" fill="url(#bg)"/><circle cx="1400" cy="-30" r="290" fill="#7bf2ca" opacity=".12"/><text x="100" y="102" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#7bf2ca">CONSENT-FIRST AI</text><text x="100" y="193" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">Opt-in statt</text><text x="100" y="254" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900" fill="#f1f7ff">Überwachung.</text><text x="100" y="308" font-family="Inter,Arial,sans-serif" font-size="20" fill="#b8d8d2">Assistant aus · Screen/Cam aus · externe Übergabe sichtbar</text><rect x="100" y="363" width="260" height="55" rx="19" fill="url(#mint)"/><text x="230" y="398" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#07131f">YOU STAY IN CONTROL</text><rect x="930" y="73" width="510" height="350" rx="30" fill="#0b2425" stroke="#387b6e"/><g font-family="Inter,Arial,sans-serif"><rect x="972" y="110" width="426" height="71" rx="18" fill="#123a37"/><circle cx="1004" cy="145" r="16" fill="#7bf2ca" opacity=".18"/><text x="1004" y="151" text-anchor="middle" font-family="Arial" font-size="18" fill="#7bf2ca">✓</text><text x="1033" y="141" font-size="14" font-weight="800" fill="#f1f7ff">Local-first core</text><text x="1033" y="162" font-size="11" fill="#a7c9c1">Kein API-Key · kein Konto · kein verstecktes INTERNET</text><rect x="972" y="199" width="426" height="71" rx="18" fill="#152d2b"/><circle cx="1004" cy="234" r="16" fill="#ffcf7b" opacity=".18"/><text x="1004" y="240" text-anchor="middle" font-family="Arial" font-size="18" fill="#ffcf7b">↗</text><text x="1033" y="230" font-size="14" font-weight="800" fill="#f1f7ff">External hand-off</text><text x="1033" y="251" font-size="11" fill="#a7c9c1">Browser, Telefon und Kamera erst nach deiner Aktion</text><rect x="972" y="288" width="426" height="93" rx="18" fill="#102321"/><text x="996" y="319" font-size="12" font-weight="800" fill="#7bf2ca">PERMISSIONS YOU CAN SEE</text><text x="996" y="344" font-size="12" fill="#b8d8d2">Assistant is opt-in. Awareness is opt-in.</text><text x="996" y="365" font-size="12" fill="#b8d8d2">Every boundary has a clear UI.</text></g></svg>
